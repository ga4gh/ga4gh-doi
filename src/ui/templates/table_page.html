{% extends "base.html" %}

{% block title %}GA4GH DOI Service - {{ heading }}{% endblock %}

{% block content %}
<h2>{{ heading }}</h2>
{% if description %}
<p class="table-page-description">{{ description }}</p>
{% endif %}
<!-- Columns match src/models/doi.py: {{ model_name }} -->
<div class="table-page">
  <div class="table-controls-top">
    <input type="search" class="table-search" data-table-search placeholder="Search {{ heading }}…" />
    <div class="page-size-group" data-table-page-size></div>
  </div>
  <div class="table-wrap">
    <table data-api="{{ api_endpoint }}">
      <thead>
        <tr>
          {% for column in columns %}
          <th data-field="{{ column.field }}" data-format="{{ column.format|default('') }}">{{ column.label }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="pagination" data-table-pagination></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/assets/doi-table.js"></script>
{% endblock %}
